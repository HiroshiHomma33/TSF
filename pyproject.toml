[project]
name = "tsf"
version = "0.1.0"
description = "TimeSeries Forecasting Project"
readme = "README.md"
# バージョンを 3.14 に統一して互換性を確保
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "statsmodels>=0.14.6",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "mypy>=1.20.1",
    "numpy>=2.4.4",
    "pandas-stubs>=3.0.0.260204",
    "ruff>=0.15.10",
    "types-python-dateutil>=2.9.0.20260408",
    "types-requests>=2.33.0.20260408",
    "types-setuptools>=82.0.0.20260408",
]

[tool.ruff]
exclude = [".venv", ".git", "__pycache__", "TimeSeriesForecastingInPython-master"]
line-length = 88
# プロジェクト全体と合わせる
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "ANN"] # ANN(型ヒント)を追加
ignore = ["E501", "E402", "I001"]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
# 仮想環境のパスを明示
venv_dir = ".venv"

[[tool.mypy.overrides]]
# 型定義がないライブラリを一括で無視設定
module = [
    "statsmodels.*",
    "matplotlib.*"
]
ignore_missing_imports = true

[tool.pyright]
# Pyrefly/Pyrightの警告がRuffと被らないよう最小限にする
typeCheckingMode = "off" 
venvPath = "."
venv = ".venv"

